<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lancam control</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --ink: #1c1c1e; --muted: #6d6d70;
    --line: #e0e0dc; --accent: #0f766e; --live: #c2410c; --prev: #1d4ed8;
    --stop: #6d6d70; --chip: #ececea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316; --panel: #1c1c21; --ink: #e8e8ea; --muted: #9a9aa0;
      --line: #2c2c33; --accent: #2dd4bf; --live: #fb923c; --prev: #60a5fa;
      --stop: #9a9aa0; --chip: #26262c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .pill {
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    background: var(--chip); color: var(--muted); text-transform: uppercase;
    letter-spacing: .08em;
  }
  .pill.preview { background: var(--prev); color: #fff; }
  .pill.live { background: var(--live); color: #fff; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 0 0 14px;
  }
  label { display: block; margin-bottom: 12px; }
  label span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select, input {
    width: 100%; padding: 7px 9px; border-radius: 8px; font: inherit;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  select:disabled, input:disabled { opacity: .55; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1; padding: 9px 10px; border: 0; border-radius: 8px; font: inherit;
    font-weight: 600; cursor: pointer; color: #fff; background: var(--stop);
  }
  button:disabled { opacity: .4; cursor: default; }
  #btnPreview { background: var(--prev); }
  #btnLive { background: var(--live); }
  #btnStop { background: var(--stop); }
  .monitor { position: relative; }
  .monitor img {
    display: block; width: 100%; border-radius: 8px; background: #000;
    aspect-ratio: 16 / 9; object-fit: contain; max-width: 100%;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8a8a8a; font-size: 13px;
    letter-spacing: .06em; text-transform: uppercase; pointer-events: none;
  }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px; margin-top: 14px;
  }
  .stat { background: var(--chip); border-radius: 8px; padding: 8px 10px; }
  .stat b {
    display: block; font-size: 16px; font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .source { margin-top: 12px; color: var(--muted); font-size: 12px; word-break: break-all; }
  .meters { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .meters[hidden] { display: none; }
  .meters span { font-size: 11px; color: var(--muted); width: 14px; text-align: right; }
  .meter {
    flex: 1; height: 8px; background: var(--chip); border-radius: 4px;
    overflow: hidden; position: relative;
  }
  .meter i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--live));
    transition: width 90ms linear;
  }
  .meters.idle .meter i { background: var(--stop); }
  .err { color: var(--live); margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>lancam <span>webcam + audio &rarr; NDI</span></h1>
    <span class="pill" id="pill">stopped</span>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Source</h2>
      <label><span>Camera</span><select id="device"></select></label>
      <div class="row">
        <label><span>Mode</span><select id="mode"></select></label>
        <label><span>Frame rate</span><select id="fps"></select></label>
      </div>
      <label><span>NDI name <em>(optional)</em></span><input id="name" placeholder="camera name"></label>
      <label><span>NDI groups <em>(optional)</em></span><input id="groups" placeholder="public"></label>
      <label><span>Audio</span><select id="audio"></select></label>
      <div class="actions">
        <button id="btnPreview">Preview</button>
        <button id="btnLive">Go live</button>
        <button id="btnStop" disabled>Stop</button>
      </div>
      <div class="err" id="err"></div>
    </section>

    <section class="card">
      <h2>Monitor</h2>
      <div class="monitor">
        <img id="preview" src="/preview" alt="preview">
        <div class="overlay" id="overlay">not streaming</div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sFps">–</b><span>fps</span></div>
        <div class="stat"><b id="sRes">–</b><span>resolution</span></div>
        <div class="stat"><b id="sViewers">–</b><span>viewers</span></div>
        <div class="stat"><b id="sTally">–</b><span>tally</span></div>
        <div class="stat"><b id="sUp">–</b><span>uptime</span></div>
        <div class="stat"><b id="sAudio">–</b><span>audio</span></div>
      </div>
      <div class="meters" id="meters" hidden>
        <span>L</span><div class="meter"><i id="mL"></i></div>
        <span>R</span><div class="meter"><i id="mR"></i></div>
      </div>
      <div class="source" id="source"></div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let devices = [], audioCards = [];

async function j(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function fmtUptime(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

const DECODABLE = ['MJPG', 'JPEG', 'YUYV', 'NV12'];

function fillModes() {
  const dev = devices.find(d => d.path === $('device').value);
  const seen = new Map();
  for (const m of (dev ? dev.modes : []).filter(m => DECODABLE.includes(m.fourcc))) {
    const k = `${m.fourcc}|${m.width}|${m.height}`;
    if (!seen.has(k)) seen.set(k, m);
  }
  const modes = [...seen.values()].sort((a, b) => b.width * b.height - a.width * a.height);
  $('mode').innerHTML = modes.map(m =>
    `<option value="${m.fourcc}|${m.width}|${m.height}">${m.fourcc} ${m.width}x${m.height}</option>`
  ).join('');
  const pref = modes.find(m => m.width === 1920 && m.height === 1080 && m.fourcc === 'MJPG') || modes[0];
  if (pref) $('mode').value = `${pref.fourcc}|${pref.width}|${pref.height}`;
  fillFps();
}

function fillFps() {
  const dev = devices.find(d => d.path === $('device').value);
  const [fcc, w, h] = ($('mode').value || '||').split('|');
  const fpsList = [...new Set((dev ? dev.modes : [])
    .filter(m => m.fourcc === fcc && m.width == w && m.height == h)
    .map(m => m.fps))].sort((a, b) => b - a);
  $('fps').innerHTML = fpsList.map(f => `<option value="${f}">${f} fps</option>`).join('');
  if (fpsList.includes(60)) $('fps').value = '60';
}

async function loadDevices() {
  devices = await j('/api/devices');
  $('device').innerHTML = devices.map(d =>
    `<option value="${d.path}">${d.card} (${d.path})</option>`).join('');
  fillModes();
  syncAudio();
}

async function loadAudio() {
  audioCards = await j('/api/audio');
  $('audio').innerHTML =
    '<option value="">No audio (video only)</option>' +
    '<option value="auto">Camera microphone (auto)</option>' +
    audioCards.map(c => `<option value="${c.device}">${c.label}</option>`).join('');
  syncAudio();
}

async function start(preview) {
  const [fourcc, width, height] = $('mode').value.split('|');
  $('err').textContent = '';
  try {
    const res = await j('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        preview,
        device: $('device').value,
        fourcc,
        width: +width,
        height: +height,
        fps: +$('fps').value,
        name: $('name').value,
        groups: $('groups').value,
        audio: $('audio').value || null,
      }),
    });
    // Server may have fallen back to a decodable mode; reflect the truth.
    if (res.mode) {
      const key = `${res.mode.fourcc}|${res.mode.width}|${res.mode.height}`;
      if ([...$('mode').options].some(o => o.value === key)) {
        $('mode').value = key;
        fillFps();
        $('fps').value = String(res.mode.fps);
      }
    }
  } catch (e) {
    $('err').textContent = e.message;
  }
  tick();
}

async function tick() {
  try {
    const s = await j('/api/state');
    const st = s.state;
    const pill = $('pill');
    pill.textContent = st;
    pill.className = 'pill' + (st === 'live' ? ' live' : st === 'preview' ? ' preview' : '');
    const running = st !== 'stopped';
    $('overlay').style.display = running ? 'none' : 'flex';
    $('btnPreview').disabled = running;
    $('btnLive').disabled = running;
    $('btnStop').disabled = !running;
    for (const el of ['device', 'mode', 'fps', 'audio', 'name', 'groups']) {
      $(el).disabled = running;
    }
    if (running) {
      const t = s.stats;
      $('sFps').textContent = t.fps ? t.fps.toFixed(1) : '–';
      $('sRes').textContent = t.resolution || '–';
      $('sViewers').textContent = st === 'live' ? t.viewers : '–';
      $('sTally').textContent = t.tally
        ? [t.tally[0] ? 'PGM' : '', t.tally[1] ? 'PRV' : ''].filter(Boolean).join('/') || '–'
        : '–';
      $('sUp').textContent = fmtUptime(t.uptime || 0);
      $('sAudio').textContent = t.audio ? 'on' : 'off';
      $('source').textContent = t.source ? `NDI source: ${t.source}` : '';
      metersOn = t.audio;
      $('meters').hidden = !t.audio;
    } else {
      $('preview').src = '/preview'; // drop any frozen last frame
      $('sFps').textContent = $('sRes').textContent = $('sViewers').textContent = '–';
      $('sTally').textContent = $('sUp').textContent = '–';
      $('sAudio').textContent = '–';
      $('source').textContent = '';
      metersOn = false;
      $('meters').hidden = true;
    }
    if (running) $('err').textContent = '';
    else if (s.error) $('err').textContent = s.error;
  } catch (e) { /* server restarting */ }
}

function syncAudio() {
  if ($('audio').value !== 'auto') return;
  const dev = devices.find(d => d.path === $('device').value);
  const card = dev.card.toLowerCase();
  const hasMic = dev && audioCards.some(c =>
    c.label.toLowerCase().includes(card) ||
    (c.alt || '').toLowerCase().replace(/_/g, ' ').includes(card));
  if (!hasMic) $('audio').value = '';
}

let metersOn = false;
setInterval(async () => {
  if (!metersOn) return;
  try {
    const lv = await j('/api/levels');
    $('mL').style.width = Math.min(100, (lv.levels[0] || 0) * 100) + '%';
    $('mR').style.width = Math.min(100, (lv.levels[1] || 0) * 100) + '%';
    $('meters').classList.toggle('idle', !lv.active);
  } catch (e) { /* server restarting */ }
}, 140);

$('device').addEventListener('change', () => { fillModes(); syncAudio(); });
$('mode').addEventListener('change', fillFps);
$('btnPreview').addEventListener('click', () => start(true));
$('btnLive').addEventListener('click', () => start(false));
$('btnStop').addEventListener('click', async () => { await j('/api/stop', { method: 'POST' }); tick(); });

async function loadSettings() {
  try {
    const s = await j('/api/settings');
    if (s.device && [...$('device').options].some(o => o.value === s.device)) {
      $('device').value = s.device;
    }
    fillModes();
    const mk = `${s.fourcc}|${s.width}|${s.height}`;
    if (s.fourcc && [...$('mode').options].some(o => o.value === mk)) $('mode').value = mk;
    fillFps();
    if (s.fps && [...$('fps').options].some(o => o.value === String(s.fps))) {
      $('fps').value = String(s.fps);
    }
    $('name').value = s.name || '';
    $('groups').value = s.groups || '';
    const audio = s.audio || '';
    if ([...$('audio').options].some(o => o.value === audio)) $('audio').value = audio;
    syncAudio();
  } catch (e) { /* first run: no saved settings */ }
}

Promise.all([loadDevices(), loadAudio()]).then(loadSettings);
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
