[package]
name = "lancam"
version = "0.1.0"
edition = "2021"
description = "Serve your webcam and any audio as an NDI stream on the local network"

[dependencies]
anyhow = "1"
arc-swap = "1"
alsa = "0.9"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
futures-util = "0.3"
jpeg-encoder = "0.6"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-stream = "0.1"
ureq = { version = "2", features = ["json"] }
v4l = "0.14"
zune-jpeg = "0.4"

[profile.release]
lto = true
